<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCS DSA Master Prep</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#fafbff;--text:#26324a;--muted:#7b869d;
  --line:#e5e9f2;--purple:#8b7cf6;--blue:#67b7ff;--green:#62d5a6;--pink:#f48fb1;
  --shadow:0 12px 30px rgba(57,70,108,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:linear-gradient(135deg,#f7f8fc,#eef5ff 57%,#fff3f8);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.dark{
  --surface:#171b26;
  --surface2:#121620;
  --text:#f1f4fb;
  --muted:#9aa5bb;
  --line:#2a3141;
  --purple:#9b8cff;
  --blue:#71bcff;
  --green:#6bddae;
  --pink:#ff9fbe;
  --shadow:0 18px 45px rgba(0,0,0,.34);
  background:
    radial-gradient(circle at 12% 8%,rgba(139,124,246,.10),transparent 28%),
    radial-gradient(circle at 88% 18%,rgba(103,183,255,.08),transparent 30%),
    radial-gradient(circle at 55% 100%,rgba(244,143,177,.05),transparent 34%),
    #0d1119;
}
button,input,select,textarea{font:inherit}
button{border:0}
.container{max-width:1450px;margin:auto;padding:28px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.brand h1{margin:0;font-size:30px;letter-spacing:-.8px}
.brand p{margin:7px 0 0;color:var(--muted)}
.header-actions{display:flex;align-items:center;gap:10px}
.header-btn,.percent{
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:800;cursor:pointer
}
.percent{cursor:default}
.dashboard{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.stat{padding:18px}
.kicker{font-size:12px;color:var(--muted)}
.big{font-size:31px;font-weight:900;margin:3px 0}
.progress{height:10px;border-radius:999px;background:#e9edf4;overflow:hidden;margin-top:10px}
body.dark .progress{background:#2b3242}
.bar{height:100%;width:0;border-radius:999px;transition:.3s;background:linear-gradient(90deg,var(--purple),var(--blue))}
.toolbar-card{padding:15px;margin-bottom:18px}
.toolbar{display:grid;grid-template-columns:1.5fr .8fr .9fr .8fr auto auto;gap:9px}
input,select{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;
  background:var(--surface2);color:var(--text);outline:none
}
.filter,.reset{padding:12px 13px;border-radius:13px;cursor:pointer;font-weight:800}
.filter{background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.filter.active{background:#fff5df;color:#a06c15}
body.dark .filter.active{background:#382d1d;color:#ffc96a}
.reset{background:#fff0f4;color:#bd4b74}
body.dark .reset{background:#38242d;color:#ff9fbd}
.toolbar-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.legend{display:flex;gap:7px}
.diff,.tag{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:999px;font-size:9.5px;font-weight:850}
.diff.easy{background:#e9fbf3;color:#238966}.diff.medium{background:#eaf5ff;color:#2b7ab8}.diff.hard{background:#fff0f5;color:#c44e76}
.tag{background:#f1efff;color:#6960ca}body.dark .tag{background:#29263e;color:#b9b0ff}
.meta{font-size:12px;color:var(--muted)}
.sections{display:flex;flex-direction:column;gap:14px}
.section-header{
  width:100%;padding:17px 18px;display:flex;justify-content:space-between;align-items:center;
  gap:15px;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);cursor:pointer
}
.section-left{display:flex;gap:13px;align-items:center;min-width:0}
.section-num{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;font-weight:900;
  background:linear-gradient(135deg,#eeeaff,#e9f5ff);color:#6c62ce;flex:none}
body.dark .section-num{background:#282e40;color:#b9b0ff}
.section-name{font-size:17px;font-weight:900}.section-desc{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.section-right{display:flex;align-items:center;gap:10px}
.section-count{padding:7px 10px;border-radius:999px;background:#f2f0ff;color:#6d63ce;font-size:12px;font-weight:850;white-space:nowrap}
body.dark .section-count{background:#29263e;color:#b9b0ff}
.chevron{font-size:20px;color:var(--muted);transition:.2s}.section.open .chevron{transform:rotate(180deg)}
.section-content{max-height:0;overflow:hidden;opacity:0;transition:.3s;padding:0;margin:0}
.section.open .section-content{max-height:12000px;opacity:1;padding:14px 0 4px 18px;margin-left:18px;border-left:3px solid rgba(139,124,246,.18)}
.question-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.question{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;position:relative;min-width:0}
.question::before{content:"";position:absolute;left:-20px;top:25px;width:13px;height:2px;background:rgba(139,124,246,.28)}
.question.done{opacity:.58}.question.done .q-title{text-decoration:line-through}
.checkbox{width:22px;height:22px;margin-top:2px;accent-color:var(--purple);cursor:pointer;flex:none}
.q-main{min-width:0;flex:1}.q-link{text-decoration:none;display:block}.q-link:hover .q-title{color:var(--purple);text-decoration:underline;text-underline-offset:3px}
.q-title{font-size:16px;font-weight:500;line-height:1.45;letter-spacing:0}
.q-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.q-actions{display:flex;gap:6px;flex:none}.icon{
  width:34px;height:34px;border-radius:10px;background:transparent;color:var(--muted);
  border:1px solid transparent;display:grid;place-items:center;cursor:pointer
}
.icon:hover{background:rgba(139,124,246,.09);color:var(--purple)}
.star.active{background:#fff5df;color:#e4a126;border-color:#f0d394}
body.dark .star.active{background:#382d1d;color:#ffc96a;border-color:#604a27}
.empty{padding:40px;text-align:center;color:var(--muted)}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}

/* Notion-like notes */
.notes-modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(10,15,24,.60);backdrop-filter:blur(8px);z-index:3000
}
.notes-modal.open{display:flex}
.notes-panel{
  width:min(1100px,96vw);height:min(860px,95vh);background:var(--surface);
  border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.32);
  display:flex;flex-direction:column
}
.notes-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}
.notes-question{font-size:18px;font-weight:900}.notes-sub{font-size:11px;color:var(--muted);margin-top:4px}
.close{width:36px;height:36px;border-radius:10px;background:transparent;color:var(--muted);font-size:23px;cursor:pointer}
.notes-tools{
  display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:8px 13px;
  border-bottom:1px solid var(--line);background:var(--surface2)
}
.notes-tools button{background:transparent;color:var(--muted);padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12px}
.notes-tools button:hover{background:rgba(139,124,246,.1);color:var(--text)}
.sep{width:1px;height:21px;background:var(--line);margin:0 3px}
.notes-scroller{flex:1;min-height:0;overflow:auto}
.notion-page{max-width:860px;margin:auto;padding:52px 55px 90px}
.page-title[contenteditable]{font-size:38px;font-weight:900;line-height:1.15;outline:0;min-height:48px}
.page-title:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.48}
.page-meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;margin:9px 0 28px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--purple)}
.editor{outline:0;min-height:520px;font-size:16px;line-height:1.72}
.editor:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.48}
.editor p{margin:4px 0 9px}.editor h1{font-size:30px;line-height:1.2;margin:25px 0 10px}
.editor h2{font-size:24px;line-height:1.25;margin:22px 0 8px}.editor h3{font-size:19px;margin:18px 0 7px}
.editor ul,.editor ol{padding-left:27px;margin:7px 0 10px}.editor li{padding:2px 0}
.editor blockquote{margin:12px 0;padding:9px 14px;border-left:3px solid var(--purple);background:rgba(139,124,246,.06);color:var(--muted);border-radius:0 8px 8px 0}
.editor pre{background:#171b24;color:#f1f4fa;padding:15px;border-radius:12px;overflow:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.editor hr{border:0;border-top:1px solid var(--line);margin:20px 0}.editor a{color:var(--purple)}
.check-line{display:flex;align-items:flex-start;gap:8px;margin:5px 0}.check-line input{width:16px;height:16px;margin-top:7px;accent-color:var(--purple)}
.slash-menu{
  position:fixed;display:none;width:300px;max-height:330px;overflow:auto;padding:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);z-index:3500
}
.slash-menu.open{display:block}.slash-item{display:flex;gap:10px;align-items:center;width:100%;padding:9px;border-radius:9px;background:transparent;color:var(--text);cursor:pointer;text-align:left}
.slash-item:hover,.slash-item.selected{background:rgba(139,124,246,.1)}
.slash-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(139,124,246,.1);font-size:11px}
.slash-title{display:block;font-size:12px;font-weight:850}.slash-desc{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.notes-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 15px;border-top:1px solid var(--line)}
.notes-status{font-size:11px;color:var(--muted)}.notes-actions{display:flex;gap:7px}.save{padding:9px 13px;border-radius:10px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}.done-btn{padding:9px 13px;border-radius:10px;background:var(--surface2);color:var(--text);font-weight:800;cursor:pointer}

/* Enhanced dark mode */
body.dark .header-btn,
body.dark .percent,
body.dark .card,
body.dark .section-header,
body.dark input,
body.dark select,
body.dark .notes-panel,
body.dark .slash-menu{
  box-shadow:0 16px 38px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.018);
}

body.dark .header-btn:hover,
body.dark .section-header:hover{
  border-color:#394257;
  box-shadow:0 19px 44px rgba(0,0,0,.34), 0 0 0 1px rgba(155,140,255,.04);
}

body.dark .toolbar-card{
  background:linear-gradient(180deg,#181e2a,#151a25);
}

body.dark input,
body.dark select{
  background:#121721;
  border-color:#2b3344;
}

body.dark input::placeholder{
  color:#6f7a91;
}

body.dark input:focus,
body.dark select:focus{
  border-color:#7569db;
  box-shadow:0 0 0 3px rgba(155,140,255,.11),0 10px 28px rgba(0,0,0,.22);
}

body.dark .filter{
  background:#121721;
  border-color:#2b3344;
}

body.dark .filter:hover{
  color:#d9def0;
  background:#1b2130;
}

body.dark .reset{
  background:#351f2a;
  border:1px solid #56303f;
  color:#ffb0c7;
}

body.dark .reset:hover{
  background:#412531;
}

body.dark .section-header{
  background:linear-gradient(180deg,#1a202d,#171c28);
  border-color:#293142;
}

body.dark .section-header:hover{
  background:linear-gradient(180deg,#1c2331,#191f2b);
}

body.dark .section.open .section-header{
  border-color:#3b3854;
  box-shadow:0 17px 42px rgba(0,0,0,.31),inset 0 1px 0 rgba(155,140,255,.035);
}

body.dark .section-num{
  background:linear-gradient(135deg,#29263e,#1f3141);
  color:#c7c0ff;
}

body.dark .section-count{
  background:#252338;
  color:#bdb5ff;
  border:1px solid #3a3453;
}

body.dark .section-content{
  border-left-color:rgba(155,140,255,.24);
}

body.dark .question{
  background:linear-gradient(180deg,#191f2b,#171c27);
}

body.dark .question::before{
  background:rgba(155,140,255,.30);
}

body.dark .question:hover{
  border-color:#30394c;
  transform:translateY(-1px);
  box-shadow:0 14px 32px rgba(0,0,0,.26);
}

body.dark .question-title{
  color:#edf1fa;
}

body.dark .question-link:hover .question-title{
  color:#b9b1ff;
}

body.dark .q-meta .diff.easy{
  background:#163429;
  color:#72ddb1;
  border:1px solid #245844;
}

body.dark .q-meta .diff.medium{
  background:#152d3d;
  color:#7fc5ff;
  border:1px solid #274a63;
}

body.dark .q-meta .diff.hard{
  background:#3a222d;
  color:#ffabc5;
  border:1px solid #603545;
}

body.dark .tag{
  background:#29273d;
  color:#bcb5ff;
  border:1px solid #3a3554;
}

body.dark .checkbox{
  filter:none;
}

body.dark .icon{
  color:#8792a8;
}

body.dark .icon:hover{
  background:#242a3a;
  color:#d6d1ff;
}

body.dark .star.active{
  background:#3b2e1d;
  color:#ffd16f;
  border-color:#684f29;
}

body.dark .progress{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
}

body.dark .bar{
  box-shadow:0 0 14px rgba(155,140,255,.16);
}

body.dark .footer{
  color:#707b92;
}

body.dark .notes-modal{
  background:rgba(3,6,12,.70);
}

body.dark .notes-panel{
  background:linear-gradient(180deg,#171c27,#151a24);
  border-color:#2a3243;
  box-shadow:0 35px 100px rgba(0,0,0,.48);
}

body.dark .notes-top,
body.dark .notes-bottom{
  background:#151a24;
}

body.dark .notes-tools{
  background:#121721;
  border-color:#282f3e;
}

body.dark .notes-tools button:hover{
  background:#242a3a;
  color:#f0f3fb;
}

body.dark .page-title{
  color:#f5f7fc;
}

body.dark .editor{
  color:#e9edf6;
}

body.dark .editor blockquote{
  background:rgba(155,140,255,.055);
  border-left-color:#9b8cff;
  color:#9da8bc;
}

body.dark .editor pre{
  background:#0c1017;
  border:1px solid #252d3c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

body.dark .slash-menu{
  background:#171c27;
  border-color:#30384a;
  box-shadow:0 22px 55px rgba(0,0,0,.42);
}

body.dark .slash-item:hover,
body.dark .slash-item.selected{
  background:#242a3a;
}

body.dark .slash-icon{
  background:#29273d;
  color:#c1baff;
}

body.dark .save{
  background:#8b7cf6;
  box-shadow:0 8px 20px rgba(139,124,246,.20);
}

body.dark .done-btn{
  background:#121721;
  border:1px solid #2b3344;
  color:#dce1ec;
}

body.dark .close{
  color:#8b96ab;
}

body.dark .close:hover{
  background:#242a3a;
  color:#eef2fa;
}

body.dark .notes-status{
  color:#737e95;
}

/* Softer scrollbar for the dark experience */
body.dark ::-webkit-scrollbar{
  width:10px;
  height:10px;
}
body.dark ::-webkit-scrollbar-track{
  background:#10141d;
}
body.dark ::-webkit-scrollbar-thumb{
  background:#30384a;
  border:2px solid #10141d;
  border-radius:999px;
}
body.dark ::-webkit-scrollbar-thumb:hover{
  background:#414b61;
}


body.dark .header-actions .header-btn{
  background:linear-gradient(180deg,#1c2331,#171d29);
  border-color:#30394b;
}
body.dark .header-actions .header-btn:hover{
  border-color:#4a4468;
  color:#f1efff;
}
body.dark .percent{
  background:linear-gradient(180deg,#1c2230,#171c28);
  border-color:#30384a;
  color:#c5c0ff;
}

@media(max-width:1050px){.dashboard{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
  .container{padding:17px}.header{flex-direction:column}.header-actions{width:100%;justify-content:space-between}
  .dashboard{grid-template-columns:1fr}.question-grid{grid-template-columns:1fr}.section-desc{display:none}.section-count{display:none}
  .notion-page{padding:32px 22px 60px}.page-title[contenteditable]{font-size:30px}.editor{font-size:15px}.notes-tools{overflow:auto}
}
</style>
</head>
<body>
<div class="container">
<header class="header">
  <div class="brand">
    <h1>🎯 TCS DSA Master Prep</h1>
    <p id="subtitle"></p>
  </div>
  <div class="header-actions">
    <button class="header-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div class="percent" id="overallBadge">0%</div>
  </div>
</header>

<section class="dashboard">
  <div class="card stat"><div class="kicker">Overall Progress</div><div class="big" id="overallText">0 / 190</div><div class="progress"><div class="bar" id="overallBar"></div></div><div class="meta" id="remaining">0 solved • 190 remaining</div></div>
  <div class="card stat"><div class="kicker">🟢 Easy</div><div class="big" id="easyText">0 / 0</div><div class="progress"><div class="bar" id="easyBar" style="background:linear-gradient(90deg,#62d5a6,#a3ecd0)"></div></div></div>
  <div class="card stat"><div class="kicker">🔵 Medium</div><div class="big" id="mediumText">0 / 0</div><div class="progress"><div class="bar" id="mediumBar" style="background:linear-gradient(90deg,#67b7ff,#a8d8ff)"></div></div></div>
  <div class="card stat"><div class="kicker">🩷 Hard</div><div class="big" id="hardText">0 / 0</div><div class="progress"><div class="bar" id="hardBar" style="background:linear-gradient(90deg,#f48fb1,#ffc9d9)"></div></div></div>
</section>

<section class="card toolbar-card">
  <div class="toolbar">
    <input id="search" placeholder="🔎 Search questions...">
    <select id="difficulty"><option value="all">All Difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
    <select id="category"><option value="all">All Sections</option><option>Number</option><option>Number System</option><option>Array</option><option>Sorting</option><option>String</option></select>
    <select id="status"><option value="all">All Status</option><option value="todo">Not Solved</option><option value="done">Solved</option></select>
    <button class="filter" id="favoriteFilter" onclick="toggleFavoriteFilter()">☆ Favorites</button>
    <button class="reset" onclick="resetAll()">Reset</button>
  </div>
  <div class="toolbar-bottom"><div class="legend"><span class="diff easy">Easy</span><span class="diff medium">Medium</span><span class="diff hard">Hard</span></div><div class="meta" id="shownCount">190 questions</div></div>
</section>

<main class="sections" id="sections"></main>
<div class="footer">190 unique questions • clickable source links • favorites • Notion-style notes • local progress ✨</div>
</div>

<div class="notes-modal" id="notesModal" aria-hidden="true">
  <div class="notes-panel" role="dialog" aria-modal="true">
    <div class="notes-top">
      <div><div class="notes-question" id="notesQuestion">📝 Notes</div><div class="notes-sub" id="notesSub"></div></div>
      <button class="close" onclick="closeNotes()">×</button>
    </div>

    <div class="notes-tools">
      <button onclick="formatText('bold')" title="Bold"><b>B</b></button>
      <button onclick="formatText('italic')" title="Italic"><i>I</i></button>
      <button onclick="formatText('underline')" title="Underline"><u>U</u></button>
      <span class="sep"></span>
      <button onclick="blockType('h1')">H1</button>
      <button onclick="blockType('h2')">H2</button>
      <button onclick="blockType('h3')">H3</button>
      <span class="sep"></span>
      <button onclick="blockType('ul')">• List</button>
      <button onclick="blockType('ol')">1. List</button>
      <button onclick="insertChecklist()">☑ To-do</button>
      <button onclick="blockType('blockquote')">❝ Quote</button>
      <button onclick="blockType('pre')">&lt;/&gt;</button>
      <button onclick="insertDivider()">—</button>
      <span class="sep"></span>
      <button onclick="insertLink()">🔗 Link</button>
      <button onclick="showSlashCommandMenu()">/ Commands</button>
    </div>

    <div class="notes-scroller">
      <div class="notion-page">
        <div class="page-title" id="noteTitle" contenteditable="true" data-placeholder="Untitled"></div>
        <div class="page-meta"><span class="dot"></span><span id="noteMeta">Personal DSA notes</span></div>
        <div class="editor" id="noteEditor" contenteditable="true" spellcheck="true" data-placeholder="Start writing, or press / for commands..."></div>
      </div>
    </div>

    <div class="notes-bottom">
      <div class="notes-status" id="notesStatus">Saved automatically</div>
      <div class="notes-actions"><button class="save" onclick="saveNote()">Save</button><button class="done-btn" onclick="closeNotes()">Done</button></div>
    </div>
  </div>
</div>

const TOTAL=QUESTIONS.length;
const SECTIONS=[
  ["Number","01","🔢","Fundamental arithmetic, digit manipulation and mathematical patterns"],
  ["Number System","02","🧮","Binary, octal, decimal conversions and representation"],
  ["Array","03","📦","Core array techniques from basic manipulation to advanced patterns"],
  ["Sorting","04","↕️","Sorting, searching, ordering and sorted-data techniques"],
  ["String","05","🔤","String manipulation, hashing, matching and sequence problems"]
];

const PROGRESS_KEY="tcs-progress-v8",FAV_KEY="tcs-favorites-v8",NOTES_KEY="tcs-notes-v8",OPEN_KEY="tcs-open-v8",THEME_KEY="tcs-theme-v8";
let solved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||"{}");
let favorites=JSON.parse(localStorage.getItem(FAV_KEY)||"{}");
let notes=JSON.parse(localStorage.getItem(NOTES_KEY)||"{}");
let opened=JSON.parse(localStorage.getItem(OPEN_KEY)||"{}");
let favoriteOnly=false,activeQuestion=null,saveTimer=null,slashIndex=0;
if(!Object.keys(opened).length)SECTIONS.forEach(s=>opened[s[0]]=true);

document.getElementById("subtitle").textContent=TOTAL+" unique questions • five sections • Easy → Medium → Hard";

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function pct(a,b){return b?Math.round(a/b*100):0;}

function filtered(){
  const s=document.getElementById("search").value.trim().toLowerCase();
  const d=document.getElementById("difficulty").value;
  const c=document.getElementById("category").value;
  const st=document.getElementById("status").value;
  return QUESTIONS.filter(q=>q.title.toLowerCase().includes(s)&&(d==="all"||q.difficulty===d)&&(c==="all"||q.category===c)&&(st==="all"||(st==="done"?!!solved[q.id]:!solved[q.id]))&&(!favoriteOnly||!!favorites[q.id]));
}

function update(){
  const done=QUESTIONS.filter(q=>solved[q.id]).length;
  document.getElementById("overallText").textContent=done+" / "+TOTAL;
  document.getElementById("overallBadge").textContent=pct(done,TOTAL)+"%";
  document.getElementById("overallBar").style.width=pct(done,TOTAL)+"%";
  document.getElementById("remaining").textContent=done+" solved • "+(TOTAL-done)+" remaining";
  ["Easy","Medium","Hard"].forEach(d=>{
    const a=QUESTIONS.filter(q=>q.difficulty===d),n=a.filter(q=>solved[q.id]).length,k=d.toLowerCase();
    document.getElementById(k+"Text").textContent=n+" / "+a.length;
    document.getElementById(k+"Bar").style.width=pct(n,a.length)+"%";
  });
  const f=QUESTIONS.filter(q=>favorites[q.id]).length,b=document.getElementById("favoriteFilter");
  b.textContent=(favoriteOnly?"★":"☆")+" Favorites"+(f?" • "+f:"");
  b.classList.toggle("active",favoriteOnly);
}

function render(){
  const list=filtered(),root=document.getElementById("sections");
  document.getElementById("shownCount").textContent=list.length+" question"+(list.length===1?"":"s");
  root.innerHTML=SECTIONS.map(([cat,num,icon,desc])=>{
    const all=QUESTIONS.filter(q=>q.category===cat),visible=list.filter(q=>q.category===cat);
    if(!visible.length)return "";
    const done=all.filter(q=>solved[q.id]).length,isOpen=opened[cat]!==false;
    const cards=visible.slice().sort((a,b)=>a.id-b.id).map(q=>`
      <article class="card question ${solved[q.id]?"done":""}">
        <input class="checkbox" type="checkbox" ${solved[q.id]?"checked":""} onchange="toggleSolved(${q.id})">
        <div class="q-main">
          ${q.link?`<a class="q-link" href="${q.link}" target="_blank" rel="noopener noreferrer">`:""}
          <div class="q-title">${q.id}. ${esc(q.title)}${q.link?" ↗":""}</div>
          ${q.link?"</a>":""}
          <div class="q-meta"><span class="diff ${q.difficulty.toLowerCase()}">${q.difficulty}</span><span class="tag">${cat}</span></div>
        </div>
        <div class="q-actions">
          <button class="icon star ${favorites[q.id]?"active":""}" onclick="toggleFavorite(${q.id},event)" title="Favorite">${favorites[q.id]?"★":"☆"}</button>
          <button class="icon" onclick="openNotes(${q.id},event)" title="Take notes">📝</button>
        </div>
      </article>
    `).join("");
    return `<section class="section ${isOpen?"open":""}">
      <button class="section-header" onclick="toggleSection('${cat}')" aria-expanded="${isOpen}">
        <span class="section-left"><span class="section-num">${num}</span><span><span class="section-name">${icon} ${cat}</span><span class="section-desc">${desc}</span></span></span>
        <span class="section-right"><span class="section-count">${done} / ${all.length} solved</span><span class="chevron">⌄</span></span>
      </button>
      <div class="section-content"><div class="question-grid">${cards}</div></div>
    </section>`;
  }).join("");
  if(!root.innerHTML.trim())root.innerHTML='<div class="card empty">No questions match your filters. 🌱</div>';
}

function toggleSection(cat){opened[cat]=opened[cat]===false;localStorage.setItem(OPEN_KEY,JSON.stringify(opened));render();}
function toggleSolved(id){solved[id]?delete solved[id]:solved[id]=true;localStorage.setItem(PROGRESS_KEY,JSON.stringify(solved));update();render();}
function toggleFavorite(id,e){if(e)e.stopPropagation();favorites[id]?delete favorites[id]:favorites[id]=true;localStorage.setItem(FAV_KEY,JSON.stringify(favorites));update();render();}
function toggleFavoriteFilter(){favoriteOnly=!favoriteOnly;update();render();}
function resetAll(){if(!confirm("Reset solved progress, favorites and notes?"))return;solved={};favorites={};notes={};localStorage.setItem(PROGRESS_KEY,"{}");localStorage.setItem(FAV_KEY,"{}");localStorage.setItem(NOTES_KEY,"{}");update();render();}

function noteData(id){return notes["q"+id]||{title:"",content:""};}
function openNotes(id,e){
  if(e)e.stopPropagation();activeQuestion=id;
  const q=QUESTIONS.find(x=>x.id===id),n=noteData(id);
  document.getElementById("notesQuestion").textContent="📝 "+q.title;
  document.getElementById("notesSub").textContent=q.difficulty+" • "+q.category;
  document.getElementById("noteTitle").innerHTML=n.title||"";
  document.getElementById("noteEditor").innerHTML=n.content||"";
  document.getElementById("noteMeta").textContent="Personal DSA notes • "+q.category+" • "+q.difficulty;
  document.getElementById("notesStatus").textContent="Saved automatically";
  document.getElementById("notesModal").classList.add("open");document.getElementById("notesModal").setAttribute("aria-hidden","false");
  setTimeout(()=>document.getElementById("noteEditor").focus(),40);
}
function saveNote(silent=false){
  if(activeQuestion===null)return;
  notes["q"+activeQuestion]={title:document.getElementById("noteTitle").innerHTML,content:document.getElementById("noteEditor").innerHTML};
  localStorage.setItem(NOTES_KEY,JSON.stringify(notes));
  if(!silent){document.getElementById("notesStatus").textContent="Saved ✓";setTimeout(()=>document.getElementById("notesStatus").textContent="Saved automatically",1000);}
}
function closeNotes(){saveNote(true);document.getElementById("notesModal").classList.remove("open");document.getElementById("notesModal").setAttribute("aria-hidden","true");hideSlash();activeQuestion=null;}
function scheduleSave(){document.getElementById("notesStatus").textContent="Unsaved changes";clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNote(true),700);}

function focusEditor(){document.getElementById("noteEditor").focus();}
function formatText(cmd){focusEditor();document.execCommand(cmd,false,null);scheduleSave();}
function blockType(type){
  focusEditor();
  if(type==="ul")document.execCommand("insertUnorderedList");
  else if(type==="ol")document.execCommand("insertOrderedList");
  else if(type==="blockquote")document.execCommand("formatBlock",false,"blockquote");
  else if(type==="pre")document.execCommand("formatBlock",false,"pre");
  else document.execCommand("formatBlock",false,type);
  scheduleSave();
}
function insertDivider(){focusEditor();document.execCommand("insertHTML",false,"<hr><p><br></p>");scheduleSave();}
function insertChecklist(){focusEditor();document.execCommand("insertHTML",false,'<div class="check-line"><input type="checkbox"><span>To-do item</span></div>');scheduleSave();}
function insertLink(){focusEditor();const u=prompt("Enter URL");if(u)document.execCommand("createLink",false,u);scheduleSave();}

const COMMANDS=[
  ["text","T","Text","Plain paragraph"],["h1","H1","Heading 1","Large heading"],["h2","H2","Heading 2","Medium heading"],
  ["h3","H3","Heading 3","Small heading"],["ul","•","Bulleted list","Bullet points"],["ol","1","Numbered list","Numbered points"],
  ["check","☑","To-do","Checklist item"],["blockquote","❝","Quote","Quote block"],["pre","</>","Code","Code block"],
  ["divider","—","Divider","Visual separator"]
];

function buildSlash(){
  const menu=document.getElementById("slashMenu");
  menu.innerHTML=COMMANDS.map((c,i)=>`<button class="slash-item ${i===slashIndex?"selected":""}" data-key="${c[0]}"><span class="slash-icon">${c[1]}</span><span><span class="slash-title">${c[2]}</span><span class="slash-desc">${c[3]}</span></span></button>`).join("");
  menu.querySelectorAll(".slash-item").forEach(b=>b.onclick=()=>chooseSlash(b.dataset.key));
}
function showSlash(){
  buildSlash();const menu=document.getElementById("slashMenu"),r=window.getSelection()?.getRangeAt(0)?.getBoundingClientRect();
  if(!r)return;menu.style.left=Math.min(window.innerWidth-315,Math.max(10,r.left))+"px";menu.style.top=Math.min(window.innerHeight-360,Math.max(10,r.bottom+6))+"px";menu.classList.add("open");
}
function hideSlash(){document.getElementById("slashMenu").classList.remove("open");slashIndex=0;}
function deleteSlash(){const s=window.getSelection();if(!s?.rangeCount)return;const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!==3)return;const t=n.textContent.slice(0,r.startOffset),i=t.lastIndexOf("/");if(i<0)return;const d=document.createRange();d.setStart(n,i);d.setEnd(n,r.startOffset);d.deleteContents();}
function chooseSlash(key){deleteSlash();hideSlash();if(key==="text")blockType("p");else if(["h1","h2","h3"].includes(key))blockType(key);else if(key==="ul"||key==="ol")blockType(key);else if(key==="check")insertChecklist();else if(key==="blockquote")blockType("blockquote");else if(key==="pre")blockType("pre");else if(key==="divider")insertDivider();focusEditor();}

function editorKey(e){
  if(e.key==="/"&&!e.ctrlKey&&!e.metaKey){
    setTimeout(()=>{const s=window.getSelection();if(!s?.rangeCount)return;const n=s.getRangeAt(0).startContainer;
      if(n.nodeType===3){const p=s.getRangeAt(0).startOffset,t=n.textContent.slice(0,p),i=t.lastIndexOf("/");if(i>=0&&(i===0||/\s/.test(t[i-1])))showSlash();}},0);
  }
  if(document.getElementById("slashMenu").classList.contains("open")){
    if(e.key==="ArrowDown"){e.preventDefault();slashIndex=(slashIndex+1)%COMMANDS.length;buildSlash();return}
    if(e.key==="ArrowUp"){e.preventDefault();slashIndex=(slashIndex-1+COMMANDS.length)%COMMANDS.length;buildSlash();return}
    if(e.key==="Enter"){e.preventDefault();document.querySelector(".slash-item.selected")?.click();return}
    if(e.key==="Escape"){e.preventDefault();hideSlash();return}
  }
  if(e.key===" "){
    const s=window.getSelection();if(s?.rangeCount){const n=s.getRangeAt(0).startContainer;if(n.nodeType===3){
      const p=s.getRangeAt(0).startOffset,t=n.textContent.slice(0,p);
      const shortcuts=[[/^# $/,"h1"],[/^## $/,"h2"],[/^### $/,"h3"],[/^- $/,"ul"],[/^\\* $/,"ul"],[/^\\d+\\. $/,"ol"],[/^> $/,"blockquote"]];
      for(const [rx,type] of shortcuts)if(rx.test(t)){const r=document.createRange();r.setStart(n,0);r.setEnd(n,p);r.deleteContents();blockType(type);break}
    }}
  }
  scheduleSave();
}

document.getElementById("noteEditor").addEventListener("keydown",editorKey);
document.getElementById("noteEditor").addEventListener("input",scheduleSave);
document.getElementById("noteTitle").addEventListener("input",scheduleSave);
document.getElementById("notesModal").addEventListener("click",e=>{if(e.target.id==="notesModal")closeNotes();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("notesModal").classList.contains("open"))closeNotes();if(e.key==="Escape")hideSlash();});
document.addEventListener("click",e=>{if(!e.target.closest("#slashMenu")&&!e.target.closest("#noteEditor"))hideSlash();});
["search","difficulty","category","status"].forEach(id=>document.getElementById(id).addEventListener("input",render));

function toggleTheme(){const d=!document.body.classList.contains("dark");document.body.classList.toggle("dark",d);localStorage.setItem(THEME_KEY,d?"dark":"light");document.getElementById("themeBtn").textContent=d?"☀️ Light Mode":"🌙 Dark Mode";}
function applyTheme(){const d=localStorage.getItem(THEME_KEY)==="dark";document.body.classList.toggle("dark",d);document.getElementById("themeBtn").textContent=d?"☀️ Light Mode":"🌙 Dark Mode";}

applyTheme();update();render();
</script>
